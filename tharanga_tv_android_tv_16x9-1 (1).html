<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tharanga TV - V7</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#0f172a;position:sticky;top:0;z-index:50;border-bottom:1px solid #1e293b;gap:6px}
.logo{display:flex;align-items:center;gap:6px;flex-shrink:0}
.logo .icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#60a5fa);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
.logo .name{font-size:15px;font-weight:700;color:#fff}
.logo .name span{color:#60a5fa}
.badge{background:#3b82f6;font-size:9px;padding:2px 6px;border-radius:5px;color:#fff;font-weight:600}
.btns{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow-x:auto}
.btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:6px 9px;border-radius:9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
.banner-wrap{padding:10px 14px 6px;position:sticky;top:52px;z-index:40;background:#0b1120}
.banner img{width:100%;height:auto;max-height:140px;object-fit:cover;border-radius:14px;display:block;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.search-wrap{padding:8px 14px 10px;position:relative}
.search-wrap::before{content:'🔍';position:absolute;left:26px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7;z-index:1}
.search{width:100%;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:11px 14px 11px 38px;color:#e2e8f0;font-size:13px;outline:none}
.search::placeholder{color:#64748b}
.sec{padding:4px 14px 8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-h h2{font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.sec-h span{font-size:11px;color:#64748b}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:7px 12px;background:#1e293b;border:2px solid transparent;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#94a3b8}
.pill.active{border-color:#3b82f6;background:#1e3a5f;color:#fff}
.pill img{width:18px;height:12px;object-fit:cover;border-radius:2px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 12px}
.cat{border-radius:14px;padding:12px 6px;cursor:pointer;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(145deg,#1e3a8a,#2563eb);border:2px solid transparent}
.cat.active{border-color:#93c5fd}
.cat .ic{font-size:20px}
.cat span{font-size:10px;font-weight:600;color:#fff}
.status{padding:0 14px 10px;font-size:12px;color:#64748b;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status .verified{background:#065f46;color:#6ee7b7;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px 24px}
.ch{background:#0f172a;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;border:1px solid #1e293b;position:relative}
.ch:active{border-color:#3b82f6;transform:translateY(-1px)}
.ch .fav{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#64748b;font-size:13px;cursor:pointer;z-index:2}
.ch .fav.on{color:#fbbf24}
.ch .l{width:56px;height:56px;min-width:56px;min-height:56px;margin:0 auto 10px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.1);overflow:hidden;flex-shrink:0}
.ch .l img{width:100%;height:100%;object-fit:contain;padding:3px}
.ch .n{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e2e8f0;padding:0 4px}
.ch .v{font-size:10px;color:#22c55e;margin-top:4px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.ch .v::before{content:'';width:6px;height:6px;background:#22c55e;border-radius:50%;display:inline-block}
.bg-hiru{background:linear-gradient(135deg,#dc2626,#ef4444)!important;color:#fff!important}
.bg-sirasa{background:linear-gradient(135deg,#b91c1c,#dc2626)!important;color:#fff!important}
.bg-shaa{background:linear-gradient(135deg,#facc15,#eab308)!important;color:#000!important}
.bg-siyatha{background:linear-gradient(135deg,#1d4ed8,#3b82f6)!important;color:#fff!important}
.bg-neth{background:linear-gradient(135deg,#7c3aed,#a855f7)!important;color:#fff!important}
.bg-gold{background:linear-gradient(135deg,#ca8a04,#facc15)!important;color:#000!important}
.bg-lite{background:linear-gradient(135deg,#0ea5e9,#38bdf8)!important;color:#fff!important}
.bg-kiss{background:linear-gradient(135deg,#ec4899,#f472b6)!important;color:#fff!important}
.bg-yfm{background:linear-gradient(135deg,#16a34a,#22c55e)!important;color:#fff!important}
.bg-yes{background:linear-gradient(135deg,#dc2626,#ef4444)!important;color:#fff!important}
.bg-derana{background:linear-gradient(135deg,#ea580c,#f97316)!important;color:#fff!important}
.bg-lakhanda{background:linear-gradient(135deg,#15803d,#22c55e)!important;color:#fff!important}
.bg-shakthi{background:linear-gradient(135deg,#991b1b,#dc2626)!important;color:#fff!important}
.bg-sooriyan{background:linear-gradient(135deg,#c2410c,#fb923c)!important;color:#fff!important}
.bg-sun{background:linear-gradient(135deg,#f59e0b,#fbbf24)!important;color:#000!important}
.bg-city{background:linear-gradient(135deg,#0e7490,#06b6d4)!important;color:#fff!important}
.modal{display:none;position:fixed;inset:0;background:#000;z-index:200;flex-direction:column}
.modal.on{display:flex}
.mtop{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(15,23,42,.95);z-index:5}
.mtop h3{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 10px;color:#fff}
.mtop button{background:#1e293b;border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer}
.player{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;width:100%;overflow:hidden}
.player video{width:100%!important;height:100%!important;object-fit:contain;background:#000;display:block}
.top-brand{position:absolute;right:12px;z-index:4;pointer-events:none;font-size:12px;font-weight:800;letter-spacing:1.5px;color:#fff;background:rgba(0,60,150,.55);padding:5px 12px;border-radius:8px;animation:moveUpDown 12s ease-in-out infinite,blinkColor 1.6s steps(2) infinite}
@keyframes moveUpDown{0%{top:12px}50%{top:calc(100% - 40px)}100%{top:12px}}
@keyframes blinkColor{0%{color:#fff}50%{color:#60a5fa}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.7);z-index:3}
.overlay.hide{display:none}
.overlay .spin{width:36px;height:36px;border:3px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mact{display:none!important}
.np{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid #1e293b;padding:12px 14px;display:none;align-items:center;gap:12px;z-index:90}
.np.on{display:flex}
.np .logo-sm{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.np .i{flex:1;min-width:0}.np .i b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np .i s{font-size:11px;color:#22c55e;text-decoration:none}
.np button{width:38px;height:38px;border-radius:50%;border:none;background:#3b82f6;color:#fff;font-size:14px;cursor:pointer}
.np .stop{background:#ef4444}
.empty{text-align:center;padding:40px 20px;color:#64748b;font-size:13px}
.side-panel{position:fixed;top:0;left:-280px;width:270px;height:100%;background:#0f172a;z-index:250;transition:left .3s ease;border-right:1px solid #1e293b;overflow-y:auto;padding:12px}
.side-panel.on{left:0}
.side-panel h3{font-size:14px;margin:8px 0 12px;color:#94a3b8;padding:0 8px}
.side-panel .sp-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:6px;background:#1e293b}
.side-panel .sp-item .sp-logo{width:36px;height:36px;border-radius:8px;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.side-panel .sp-item span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-panel .close-sp{position:absolute;top:10px;right:12px;background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer}
#ytUI{display:none;padding:12px 14px}

/* Android TV / 16:9 landscape layout */
html{width:100%;height:100%;background:#0b1120}
body{min-height:100dvh;padding-bottom:0;overflow-x:hidden}
button,.cat,.pill,.ch,.play,.fav,.sp-item,a,input{ -webkit-tap-highlight-color:transparent}
button,.cat,.pill,.ch,.play,.sp-item,a,input{outline:none}
:focus-visible{outline:3px solid #facc15!important;outline-offset:3px!important;box-shadow:0 0 0 5px rgba(250,204,21,.18)!important}
@media (min-width:800px) and (orientation:landscape){
  .hdr{padding:12px 2.2vw;min-height:68px;gap:18px}
  .logo .icon{width:42px;height:42px;font-size:15px}
  .logo .name{font-size:21px}.badge{font-size:11px;padding:4px 8px}
  .btns{gap:10px;overflow:visible}
  .btn{font-size:14px;padding:10px 16px;border-radius:10px}
  .banner-wrap{padding:12px 2.2vw 8px;top:68px}
  .banner img{height:clamp(90px,17vh,160px);max-height:none;object-fit:cover;aspect-ratio:16/3}
  .search-wrap{padding:10px 2.2vw}
  .search{font-size:17px;padding:14px 18px 14px 44px}
  .search-wrap::before{left:calc(2.2vw + 14px);font-size:17px}
  .sec{padding:6px 2.2vw 10px}
  .sec-h h2{font-size:15px}.sec-h span{font-size:13px}
  .row{gap:12px}.pill{font-size:14px;padding:10px 16px}
  .cats{grid-template-columns:repeat(6,minmax(100px,1fr));gap:12px;padding:0 2.2vw 14px}
  .cat{min-height:86px;padding:14px 8px;border-radius:14px}
  .cat .ic{font-size:27px}.cat span{font-size:13px}
  .status{padding:0 2.2vw 12px;font-size:14px}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:0 2.2vw 28px}
  .ch{padding:16px 12px;border-radius:16px;min-height:150px}
  .ch .l{width:66px;height:66px;margin-bottom:12px}
  .ch .n{font-size:14px}.ch .v{font-size:12px}
  .np{padding:12px 2.2vw}
  .side-panel{width:360px;left:-370px;padding:18px}
  .side-panel.on{left:0}.side-panel .sp-item{padding:14px}
  .side-panel .sp-item span{font-size:16px}
}
@media (min-width:800px) and (orientation:portrait){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cats{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.ch,.cat,.pill,.btn,.sp-item,.play{cursor:pointer}
.ch:focus,.cat:focus,.pill:focus,.btn:focus,.sp-item:focus,.play:focus{border-color:#facc15}
#modal .mtop button:focus{outline:3px solid #facc15}
#ytFrame{aspect-ratio:16/9}

</style>
</head>

function shortName(name){if(!name)return'Channel';name=name.trim().replace(/\s*\[.*?\]/g,'').replace(/\s*\(.*?\)/g,function(m){return/\d{3,4}p/i.test(m)?m:'';}).replace(/\s{2,}/g,' ').trim();if(name.length>18){var parts=name.split(' ');if(parts.length>1){var s=parts[0];for(var i=1;i<parts.length;i++){if((s+' '+parts[i]).length<=18)s+=' '+parts[i];else break;}return s;}return name.substring(0,16)+'…';}return name;}

function parseM3U(text){
  var lines=text.split(/\r?\n/),out=[],cur=null;
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(l.indexOf('#EXTINF:')===0){
      var name=(l.match(/,(.+)$/)||[])[1]||'Channel';
      var logo=(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'';
      var group=(l.match(/group-title="([^"]*)"/)||[])[1]||'';
      cur={name:name.trim(),logo:logo,group:group,url:''};
    }else if(l&&l.charAt(0)!=='#'&&cur){cur.url=l;out.push(cur);cur=null;}
  }
  return out;
}

  var key='ch_'+curC,cached=null;
  try{if(!force){var s=localStorage.getItem(key);if(s){var d=JSON.parse(s);if(Date.now()-d.t<24*60*60*1000)cached=d.list;}}}catch(e){}
  if(cached&&cached.length){allCh=cached;filterShow(cat);document.getElementById('status').textContent=cached.length+' Channels available';return;}
  var url=curC==='all'?'https://iptv-org.github.io/iptv/index.m3u':'https://iptv-org.github.io/iptv/countries/'+curC+'.m3u';
  fetch(url+'?_='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(text){
    if(!text||text.indexOf('#EXT')===-1)throw new Error('Invalid');
    allCh=parseM3U(text);if(!allCh.length)throw new Error('Empty');
    try{localStorage.setItem(key,JSON.stringify({t:Date.now(),list:allCh}));}catch(e){}

    filterShow(cat);

function filterShow(cat){

  if(searchQ){var s=searchQ.toLowerCase();list=list.filter(function(x){return(x.name||'').toLowerCase().indexOf(s)>=0||(x.group||'').toLowerCase().indexOf(s)>=0;});}
  if(curC==='lk'&&!searchQ){
    var saved=getSavedTV();
    if(saved.length){
      var urls={};saved.forEach(function(s){urls[s.url]=true;});
      list=list.filter(function(x){return!urls[x.url];});
      list=saved.concat(list);
    }
  }
  list=list.slice(0,120);
  if(!list.length){document.getElementById('grid').innerHTML='<div class="empty">No channels found</div>';return;}
  showList(list);
}

function playTV(url,name,logo){
  stopR();curUrl=url;curName=name;curLogo=logo||'';
  var f=document.getElementById('ytFrame');if(f)f.remove();
  var v=document.getElementById('vid');v.style.display='block';
  document.getElementById('pt').textContent=name;
  document.getElementById('favBtn').textContent=isFav(url)?'★':'☆';
  document.getElementById('modal').classList.add('on');
  document.getElementById('ov').classList.remove('hide');
  document.getElementById('ovt').textContent='Connecting...';
  if(hls){try{hls.destroy();}catch(e){}hls=null;}
  v.pause();v.removeAttribute('src');v.load();
  function fail(m){
    var saved=getSavedTV();
    if(saved.length){
      var next=saved[Math.floor(Math.random()*saved.length)];
      if(next.url!==curUrl){document.getElementById('ovt').textContent='Auto → '+next.name;setTimeout(function(){playTV(next.url,next.name,next.logo||'');},800);return;}
    }
    document.getElementById('ov').classList.remove('hide');
    document.getElementById('ovt').innerHTML='❌ Play වුණේ නැහැ<br><small style="color:#94a3b8">'+m+'</small>';
  }
  function ok(){document.getElementById('ov').classList.add('hide');}
  var to=setTimeout(function(){fail('Timeout');},20000);
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,maxBufferLength:20,maxMaxBufferLength:40,startLevel:-1,capLevelToPlayerSize:true});
    hls.loadSource(url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){
      clearTimeout(to);
      try{var levels=hls.levels||[];var best=-1,bestH=9999;for(var i=0;i<levels.length;i++){var h=levels[i].height||0;if(h>0&&h<=400&&h<bestH){bestH=h;best=i;}}if(best<0&&levels.length)best=0;if(best>=0)hls.currentLevel=best;}catch(e){}
      ok();v.play().catch(function(){fail('Press play');});
    });
    hls.on(Hls.Events.ERROR,function(ev,data){if(data.fatal){clearTimeout(to);if(data.type===Hls.ErrorTypes.NETWORK_ERROR){try{hls.startLoad();}catch(e){fail('Network');}}else fail('Stream error');}});
  }else{v.src=url;v.onloadedmetadata=function(){clearTimeout(to);ok();v.play().catch(function(){});};v.onerror=function(){clearTimeout(to);fail('Error');};}
}

(function(){

  function visible(el){return !!(el&&el.getClientRects().length&&getComputedStyle(el).visibility!=='hidden'&&getComputedStyle(el).display!=='none');}

    var preferred=document.querySelector('.btn.on')||document.querySelector('.cat.active')||document.querySelector('.search');
    if(preferred&&visible(preferred))preferred.focus();
    else {var a=items();if(a[0])a[0].focus();}
  }
  function moveFocus(key){
    var a=items(),cur=document.activeElement;
    if(!a.length)return;
    if(a.indexOf(cur)<0){focusFirst();return;}
    var r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var best=null,bestScore=Infinity;
    a.forEach(function(el){
      if(el===cur)return;
      var q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;
      var primary=key==='ArrowRight'?dx:key==='ArrowLeft'?-dx:key==='ArrowDown'?dy:-dy;
      if(primary<=2)return;
      var cross=(key==='ArrowLeft'||key==='ArrowRight')?Math.abs(dy):Math.abs(dx);
      var score=primary+cross*2.4;
      if(score<bestScore){bestScore=score;best=el;}
    });
    if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});}
    else if(key==='ArrowDown')window.scrollBy({top:Math.max(180,innerHeight*.65),behavior:'smooth'});
    else if(key==='ArrowUp')window.scrollBy({top:-Math.max(180,innerHeight*.65),behavior:'smooth'});
  }
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowRight'||k==='ArrowLeft'||k==='ArrowUp'||k==='ArrowDown'){
      if(document.activeElement&&(/INPUT|TEXTAREA/.test(document.activeElement.tagName)))return;
      e.preventDefault();moveFocus(k);return;
    }
    if(k==='Enter'||k===' '){
      var el=document.activeElement;
      if(el&&el.matches('.ch,.cat,.pill,.play,.sp-item')){e.preventDefault();el.click();}
      return;
    }
    if(k==='Escape'||k==='Backspace'||k==='BrowserBack'){
      e.preventDefault();
      var modal=document.getElementById('modal'),side=document.getElementById('sidePanel');
      if(side&&side.classList.contains('on'))closeSide();
      else if(modal&&modal.classList.contains('on'))closeP();
      else if(typeof stopR==='function')stopR();
    }
  });
  document.addEventListener('focusin',function(e){
    var el=e.target;
    if(el&&el.matches('.ch,.cat,.pill,.btn,.sp-item,.play'))el.scrollIntoView({block:'nearest',inline:'nearest'});
  });
  var oldShowList=window.showList;
  if(typeof oldShowList==='function'){
    window.showList=function(list){oldShowList(list);document.querySelectorAll('.ch,.play').forEach(function(el){el.setAttribute('tabindex','0');el.setAttribute('role','button');});};
  }
  document.querySelectorAll('.btn,.cat,.pill,.sp-item').forEach(function(el){if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');});
  window.addEventListener('load',function(){setTimeout(focusFirst,250);});
  /* Android TV WebView Back key support where available */
  document.addEventListener('visibilitychange',function(){if(!document.hidden&& !document.activeElement)focusFirst();});
})();

</script>
