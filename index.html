<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tharanga TV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial}header{padding:15px;text-align:center;background:#111;border-bottom:2px solid red;font-weight:bold}.player-wrap{position:relative;background:#000}video{width:100%;height:50vh;background:#000}#status{padding:10px;color:#0f6;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}.channel{background:#191919;border:1px solid #333;padding:12px;border-radius:10px;text-align:center;cursor:pointer}.channel.active{background:#400;border-color:red}</style></head><body><header>📺 Tharanga TV - LIVE</header><div class="player-wrap"><video id="video" controls playsinline></video></div><div id="status">⏳ Loading...</div><div id="channels" class="grid"></div><script>
const PLAYLIST="https://tivimate.viulk.xyz/channels.m3u";const PROXY="https://corsproxy.io/?";const video=document.getElementById("video"),list=document.getElementById("channels"),statusEl=document.getElementById("status");let channels=[],hls=null;
function setStatus(t,c){statusEl.textContent=t;statusEl.className=c||""}
function parseM3U(txt){let lines=txt.split(/\n/),res=[],info=null;for(let l of lines){l=l.trim();if(!l)continue;if(l.startsWith("#EXTINF")){let name=l.split(",").pop();info={name:name};}else if(!l.startsWith("#")&&info){res.push({name:info.name,url:l});info=null;}}return res;}
function render(d){list.innerHTML="";d.forEach(ch=>{let b=document.createElement("div");b.className="channel";b.textContent=ch.name;b.onclick=()=>play(ch,b,false);list.appendChild(b);});}
async function load(){setStatus("⏳ Loading playlist...");try{let r=await fetch(PLAYLIST);let t=await r.text();channels=parseM3U(t);if(!channels.length)throw"empty";render(channels);setStatus("✅ Loaded "+channels.length+" channels");return;}catch(e){}try{let r=await fetch(PROXY+encodeURIComponent(PLAYLIST));let t=await r.text();channels=parseM3U(t);render(channels);setStatus("✅ Loaded "+channels.length+" (via Proxy)");}catch(e){setStatus("❌ Failed: "+e,"error")}}
function play(ch,btn,useProxy){if(hls){hls.destroy();hls=null;}document.querySelectorAll(".channel").forEach(x=>x.classList.remove("active"));btn.classList.add("active");let url=useProxy?PROXY+encodeURIComponent(ch.url):ch.url;setStatus("⏳ Playing: "+ch.name);if(Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal&&!useProxy){play(ch,btn,true)}});}else{video.src=url;video.play();}}
load();
</script></body></html>
