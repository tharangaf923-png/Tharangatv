<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tharanga TV - 130+ Live</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0}
#player{width:100%;height:50vh;background:#000;position:sticky;top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:15px}
.card{background:#1e1e1e;padding:12px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #333;font-size:13px}
.card:hover{border-color:#ff0000}
.card.active{border-color:#ff0000;background:#330000;color:#fff}
input{width:90%;margin:15px 5%;padding:12px;border-radius:20px;border:none;background:#1e1e1e;color:#fff;text-align:center;font-size:16px}
h2{padding:0 15px}
.top{padding:15px;text-align:center;background:#111}
</style>
</head>
<body>
<div class="top"><b>📺 Tharanga TV - 130+ Channels Auto</b></div>
<video id="player" controls autoplay></video>
<input type="text" id="search" placeholder="Search Hiru, Sirasa, HBO... 🔍">
<h2 id="count">Loading Channels...</h2>
<div class="grid" id="list"></div>
<script>
const video=document.getElementById('player');
const listDiv=document.getElementById('list');
const search=document.getElementById('search');
let allChannels=[];
const playlists=[
'https://iptv-org.github.io/iptv/countries/lk.m3u',
'https://raw.githubusercontent.com/iptv-org/iptv/master/countries/lk.m3u'
];
async function loadAll(){
 let combined="";
 for(let url of playlists){
  try{
   let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));
   let t=await r.text();
   combined+=t+"\n";
  }catch(e){}
 }
 // Add manual extra for 130+
 combined+=`
#EXTINF:-1, Hiru TV
https://d3eye7hg0q082c.cloudfront.net/hiru/playlist.m3u8
#EXTINF:-1, Sirasa TV
https://d3eye7hg0q082c.cloudfront.net/sirasa/playlist.m3u8
#EXTINF:-1, ITN Sri Lanka
https://mhlive.focuzs.com/ITN/master.m3u8
#EXTINF:-1, Derana TV
https://d3eye7hg0q082c.cloudfront.net/derana/playlist.m3u8
`;
 parseM3U(combined);
}
function parseM3U(text){
 const lines=text.split('\n');
 for(let i=0;i<lines.length;i++){
  if(lines[i].startsWith('#EXTINF')){
   let name=lines[i].split(',')[1]||'Channel';
   let url=lines[i+1];
   if(url && url.trim().startsWith('http')){
    allChannels.push({name:name.trim(),url:url.trim()});
   }
  }
 }
 allChannels=[...new Map(allChannels.map(c=>[c.url,c])).values()];
 document.getElementById('count').innerText=allChannels.length+'+ Channels Loaded ✅';
 render(allChannels);
 if(allChannels.length>0) play(allChannels[0]);
}
function render(channels){
 listDiv.innerHTML="";
 channels.forEach(c=>{
  let d=document.createElement('div');
  d.className='card';
  d.innerText=c.name.substring(0,22);
  d.onclick=()=>play(c,d);
  listDiv.appendChild(d);
 });
}
function play(c,el){
 if(Hls.isSupported()){
  let hls=new Hls();
  hls.loadSource(c.url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
 }else{ video.src=c.url; video.play(); }
 document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'));
 if(el) el.classList.add('active');
 window.scrollTo(0,0);
}
search.oninput=()=>{
 let q=search.value.toLowerCase();
 render(allChannels.filter(c=>c.name.toLowerCase().includes(q)));
}
loadAll();
</script>
</body>
</html>
